name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SENTINELOPS_TEST_POSTGRES: "1"
      POSTGRES_USER: sentinelops_demo
      POSTGRES_PASSWORD: ci_ephemeral_only
      POSTGRES_DB: sentinelops_demo
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinelops_demo
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: sentinelops_demo
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U sentinelops_demo -d sentinelops_demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            simulator/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q -rs
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
